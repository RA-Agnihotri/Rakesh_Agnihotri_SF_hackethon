# ── Verified Queries ───────────────────────────────────────────
verified_queries:
  - name: market_trends_by_policy_type
    question: "What are the key market trends for Health insurance?"
    sql: >
      SELECT mt.POLICY_TYPE, mt.METRIC_NAME, mt.METRIC_VALUE,
             mt.YOY_CHANGE_PCT, mt.TREND_DIRECTION, mt.REGION
      FROM market_trends AS mt
      WHERE mt.POLICY_TYPE = 'Health'
      ORDER BY mt.TREND_DATE DESC
    verified_at: 1789047580
    verified_by: Semantic Model Generator

  - name: claim_frequency_yoy
    question: "How has claim frequency changed year-over-year by region and policy type?"
    sql: >
      SELECT mt.REGION, mt.POLICY_TYPE,
             mt.METRIC_VALUE AS claim_frequency, mt.YOY_CHANGE_PCT
      FROM market_trends AS mt
      WHERE mt.METRIC_NAME = 'claim_frequency'
      ORDER BY mt.YOY_CHANGE_PCT DESC
    verified_at: 1789047580
    verified_by: Semantic Model Generator

  - name: fastest_premium_growth
    question: "Which policy types are experiencing the fastest premium growth in the market?"
    sql: >
      SELECT mt.POLICY_TYPE,
             AVG(mt.YOY_CHANGE_PCT) AS avg_yoy_growth
      FROM market_trends AS mt
      WHERE mt.METRIC_NAME = 'avg_industry_premium'
      GROUP BY mt.POLICY_TYPE
      ORDER BY avg_yoy_growth DESC
    verified_at: 1789047580
    verified_by: Semantic Model Generator

  - name: loss_ratio_vs_benchmark
    question: "How do our loss ratios compare to industry benchmarks for each policy type?"
    sql: >
      SELECT p.POLICY_TYPE,
             AVG(p.LOSS_RATIO) AS our_avg_loss_ratio,
             AVG(mt.METRIC_VALUE) AS industry_benchmark
      FROM policies AS p
      JOIN market_trends AS mt
        ON p.POLICY_TYPE = mt.POLICY_TYPE
       AND mt.METRIC_NAME = 'loss_ratio_benchmark'
      WHERE p.POLICY_STATUS = 'Active'
      GROUP BY p.POLICY_TYPE
    verified_at: 1789047580
    verified_by: Semantic Model Generator

  - name: regulatory_changes
    question: "What regulatory changes are affecting the insurance market?"
    sql: >
      SELECT mt.REGION, mt.POLICY_TYPE, mt.NOTES, mt.TREND_DATE
      FROM market_trends AS mt
      WHERE mt.METRIC_NAME = 'regulatory_change'
        AND NOT mt.NOTES IS NULL
      ORDER BY mt.TREND_DATE DESC
    verified_at: 1789047580
    verified_by: Semantic Model Generator
