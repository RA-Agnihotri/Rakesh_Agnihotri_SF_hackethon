# Semantic View: Market Intelligence
# Tables: MARKET_TRENDS, COMPETITOR_PRICING, POLICIES, CLAIMS
# VQRs: 5

name: SV_MARKET_INTELLIGENCE
description: >
  Market intelligence model for insurance industry analysis. Covers market trends,
  industry benchmarks, year-over-year changes, claim frequency, premium growth,
  loss ratio benchmarks, and regulatory changes across regions and policy types.
  Enables comparison of internal performance against market conditions.

tables:

  # ── MARKET_TRENDS ──────────────────────────────────────────────
  - name: MARKET_TRENDS
    base_table:
      database: INSURANCE_AI_HUB
      schema: ANALYTICS
      table: MARKET_TRENDS
    primary_key:
      - TREND_ID
    dimensions:
      - name: TREND_ID
        expr: TREND_ID
        data_type: VARCHAR(20)
      - name: REGION
        expr: REGION
        data_type: VARCHAR(50)
      - name: POLICY_TYPE
        expr: POLICY_TYPE
        data_type: VARCHAR(20)
      - name: METRIC_NAME
        expr: METRIC_NAME
        data_type: VARCHAR(50)
      - name: METRIC_UNIT
        expr: METRIC_UNIT
        data_type: VARCHAR(20)
      - name: TREND_DIRECTION
        expr: TREND_DIRECTION
        data_type: VARCHAR(10)
      - name: SOURCE
        expr: SOURCE
        data_type: VARCHAR(100)
      - name: NOTES
        expr: NOTES
        data_type: VARCHAR(16777216)
    facts:
      - name: METRIC_VALUE
        expr: METRIC_VALUE
        data_type: FLOAT
      - name: YOY_CHANGE_PCT
        expr: YOY_CHANGE_PCT
        data_type: FLOAT
    time_dimensions:
      - name: TREND_DATE
        expr: TREND_DATE
        data_type: DATE

